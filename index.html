<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários Kennedy</title>

    <style>
    body {
        margin: 0;
        min-height: 100vh;          /* faz o body ocupar a altura inteira da tela */
        display: flex;
        justify-content: center;    /* centraliza horizontalmente */
        align-items: center;        /* centraliza verticalmente */
        background-color: #07bdbd;
         }
    table {
        background-color: rgb(53, 60, 151);      /* cor do retângulo */
        padding: 25px;                /* espaço interno (quanto maior, maior o retângulo) */
        border-radius: 12px;          /* cantos arredondados */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); /* sombra suave */
        color: rgb(248, 223, 223);   /* ← cor das escritas */
    }
    </style>

</head>
<body>
    <header></header>
    <main>
        <table>
            <thead>
                <th>Horário / Dia</th>
                <th>Segunda-feira</th>
                <th>Terça-feira</th>
                <th>Quarta-feira</th>
                <th>Quinta-feira</th>
                <th>Sexta-feira</th>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <ul>
                            <li>7h20</li>
                            <li>8h10</li>
                            <li>9h00</li>
                            <li>10h05</li>
                            <li>10h55</li>
                            <li>11h45</li>
                        </ul>
                    </td>
                    <td id = "segunda"> </td>
                    <td id = "terça"> </td>
                    <td id = "quarta"> </td>
                    <td id = "quinta"> </td>
                    <td id = "sexta"> </td>
                </tr>
                <tr>
                    <td></td>
                    <td> <button onclick="carregar_horario('segunda', this)">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('terça', this)">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('quarta', this)">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('quinta', this)">Carregar</button> </td>
                    <td> <button onclick="carregar_horario('sexta', this /* o this serve para identificar qual foi o botão clicado */)">Carregar</button> </td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer></footer>   

    <script>

        async function carregar_horario(dia, botao) {

            botao.style.display = "none";   // faz o botão sumir

            const coluna_dia = document.getElementById(dia)
            try {
                const link = "http://localhost:3000/aulas/" + dia
                const consulta_api = await fetch(link)
                if(consulta_api.ok) {
                    const aulas_dia = await consulta_api.json()
                    if (aulas_dia.length == 0){
                        coluna_dia.innerHTML = "Nenhuma aula cadastrada!"
                    } else {
                        console.log(aulas_dia)
                        let html = "<ul>"
                        aulas_dia.resposta.forEach((aula1) => {
                            html += "<li>" + aula1.Aula + "</li>"
                        })
                        html += "</ul>"
                        coluna_dia.innerHTML += html
                    }
                }
            } catch (erro) {
                alert(erro)
                coluna_dia.innerHTML = "Erro ao carregar horários!"
            }
        }

    </script>

</body>
</html>
